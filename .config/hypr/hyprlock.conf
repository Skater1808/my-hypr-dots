background {
    monitor =
    # Nutzt das aktuelle Wallpaper direkt aus dem awww/swww-Cache
    path = screenshot
    
    # Der Weichzeichner-Effekt (Milchglas-Optik)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Eingabefeld für das Passwort
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2 # Proportion von 0.2 bis 0.8
    dots_spacing = 0.6 # Proportion von 0.0 bis 1.0
    dots_center = true
    fade_on_empty = true
    placeholder_text = <i>Passwort eingeben...</i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# Große Uhrzeit-Anzeige
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(200, 200, 200, 1.0)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}
