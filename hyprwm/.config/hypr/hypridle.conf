general {
    # Verhindert, dass das System mehrfach den Lock-Befehl aufruft
    lock_cmd = pidof hyprlock || hyprlock
    # Befehl, der vor dem eigentlichen System-Suspend (z.B. Zuklappen des Laptops) ausgeführt wird
    before_sleep_cmd = loginctl lock-session
    # Sorgt dafür, dass nach dem Aufwachen der Bildschirm wieder angeht
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Stufe: Bildschirm dimmen (nach 2,5 Minuten / 150 Sekunden)
listener {
    timeout = 150
    # Helligkeit der Tastatur und des Monitors reduzieren (z.B. über brightnessctl, falls installiert)
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 2. Stufe: Automatisch sperren (nach 3 Minuten / 180 Sekunden)
listener {
    timeout = 180
    # Ruft hyprlock auf, wenn die Zeit abgelaufen ist
    on-timeout = loginctl lock-session
}

# 3. Stufe: Monitor komplett in den Standby schalten (nach 5 Minuten / 300 Sekunden)
listener {
    timeout = 300
    # Schaltet das Videosignal der Monitore ab (DPMS)
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
