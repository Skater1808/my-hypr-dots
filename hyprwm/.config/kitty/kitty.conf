# Schriftart
font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 10
background_opacity 0.8

shell /usr/bin/fish 
# Remote control für Farb-Updates via Shortcut
allow_remote_control yes
listen_on unix:@kitty-0

# Catppuccin Mocha Farbpalette für Kitty (fallback/default)
# These will be overridden by colors.conf (included at the END)
background            #1e1e2e
foreground            #cdd6f4
selection_background  #f5e0dc
selection_foreground  #1e1e2e
url_color             #f5e0dc
cursor                #f5e0dc
active_border_color   #b4befe
inactive_border_color #6c7086

# Farb-Definitionen für das Terminal (ANSI)
color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #cba6f7
color13 #cba6f7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

# Include wallust-generated colors (MUST BE LAST to override fallbacks)
include colors.conf



# Kopiert, wenn Text markiert ist. Falls nicht, bricht es wie gewohnt den Befehl ab.
map ctrl+c copy_or_interrupt


